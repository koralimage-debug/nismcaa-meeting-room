<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NISMCAA Entries – Admin (Test Preview)</title><meta name="robots" content="noindex"><link rel="stylesheet" href="style.css">
<style>.wrap{max-width:1100px;margin:16px auto;padding:0 12px}.card{background:#fff;border-radius:8px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.kpi{background:#fff;border-radius:8px;padding:14px;border-top:4px solid var(--c2)}.kpi b{font-size:26px;display:block;color:var(--c1)}
.tw{overflow-x:auto}.tabs button{border:0;background:none;padding:8px 14px;font-weight:600;cursor:pointer;border-bottom:3px solid transparent}.tabs button.on{border-color:var(--c2);color:var(--c1)}
.flt{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.flt select,.flt input{padding:6px;border:1px solid #9aa4b1;border-radius:6px}</style></head><body>
<div class="topbar"><img src="img/global.png" width="34" height="34" alt=""><b>NISMCAA Admin – Entries &amp; Activity</b><span class="tag">TEST PREVIEW – data stays on this device</span><span class="sp"></span><a class="btn alt sm" href="index.html">Open entry form</a><button class="btn alt sm" id="demo">Load demo data</button><button class="btn red sm" id="reset">Clear all data</button></div>
<div class="wrap"><div class="kpis" id="kpis"></div>
<div class="card"><div class="tabs"><button class="on" data-t="ent">Entries</button><button data-t="act">Activity log</button><button data-t="ch">Charts</button></div></div>
<div class="card" id="t-ent"><div class="flt"><select id="fc"><option value="">All countries</option></select><select id="fs"><option value="">All statuses</option><option>Submitted</option><option>Approved</option><option>Declined</option></select><input id="fq" placeholder="Search school or entrant"><span class="sp" style="flex:1"></span><button class="btn sm" id="csv">Download CSV</button></div><div class="tw" id="etab"></div></div>
<div class="card" id="t-act" style="display:none"><div class="flt"><select id="ft"><option value="">All activity</option><option value="page_view">Page views</option><option value="form_started">Forms started</option><option value="form_submitted">Forms submitted</option><option value="payment">Payments</option><option value="status">Status changes</option><option value="pdf_saved">PDF saved</option></select><button class="btn sm" id="acsv">Download log CSV</button></div><div class="tw" id="atab"></div></div>
<div class="card" id="t-ch" style="display:none"><h3>Entries by country</h3><div id="ch1"></div><h3>Activity – last 7 days</h3><div id="ch2"></div><h3>Started vs submitted</h3><div id="ch3"></div></div></div>
<div class="modal" id="dm"><div class="box" style="max-width:640px;max-height:90vh;overflow:auto"><div id="dbody"></div><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap"><button class="btn" id="dap">Approve</button><button class="btn red" id="dde">Decline</button><button class="btn alt" id="dcl">Close</button></div></div></div>
<script src="data.js"></script><script>
const $=id=>document.getElementById(id);for(const k in COUNTRIES)$("fc").add(new Option(COUNTRIES[k].name,k));
const st=s=>`<span class="pill ${s=="Approved"?"p-app":s=="Declined"?"p-rej":"p-sub"}">${s}</span>`;
const dt=t=>new Date(t).toLocaleString("en-US",{month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
let cur=null;
function render(){const E=LS.get("nis_entries",[]),A=LS.get("nis_act",[]);
 const ng=E.filter(e=>e.fee>0&&e.paid).reduce((s,e)=>s+e.fee,0);
 $("kpis").innerHTML=[["Entries",E.length],["Awaiting review",E.filter(e=>e.status=="Submitted").length],["Approved",E.filter(e=>e.status=="Approved").length],["Forms started",A.filter(a=>a.type=="form_started").length],["Nigeria fees paid (test)","₦"+ng.toLocaleString("en-US")]].map(k=>`<div class="kpi">${k[0]}<b>${k[1]}</b></div>`).join("");
 const fc=$("fc").value,fs=$("fs").value,q=$("fq").value.toLowerCase();
 const R=E.filter(e=>(!fc||e.country==fc)&&(!fs||e.status==fs)&&(!q||(e.school+e.entrant).toLowerCase().includes(q)));
 $("etab").innerHTML=R.length?`<table><tr><th>Ref</th><th>Date</th><th>Country</th><th>School</th><th>Category</th><th>Fee</th><th>Status</th><th></th></tr>${R.map(e=>`<tr><td>${e.id}</td><td>${dt(e.t)}</td><td>${COUNTRIES[e.country].name}</td><td>${esc(e.school)}<br><small>${esc(e.entrant)}</small></td><td>${esc(e.cat)}</td><td>${e.fee>0?money(e.country,e.fee)+(e.paid?" <span class='pill p-app'>paid</span>":" <span class='pill p-pay'>unpaid</span>"):e.country=="us"?"Sponsored":"Free"}</td><td>${st(e.status)}</td><td><button class="btn sm" data-v="${e.id}">View</button></td></tr>`).join("")}</table>`:"<p class='note'>No entries yet. Submit one from the entry form, or click Load demo data.</p>";
 const ft=$("ft").value,AA=A.filter(a=>!ft||a.type==ft);
 $("atab").innerHTML=AA.length?`<table><tr><th>When</th><th>Type</th><th>Country</th><th>Detail</th></tr>${AA.map(a=>`<tr><td>${dt(a.t)}</td><td>${a.type.replace("_"," ")}</td><td>${a.country?COUNTRIES[a.country].name:""}</td><td>${esc(a.detail)}</td></tr>`).join("")}</table>`:"<p class='note'>No activity yet.</p>";
 const bar=(rows,col)=>{const m=Math.max(1,...rows.map(r=>r[1]));return `<svg width="100%" viewBox="0 0 600 ${rows.length*30+6}">${rows.map((r,i)=>`<text x="0" y="${i*30+20}" font-size="13">${esc(r[0])}</text><rect x="170" y="${i*30+6}" width="${380*r[1]/m}" height="20" fill="${r[2]||col}" rx="3"/><text x="${176+380*r[1]/m}" y="${i*30+20}" font-size="13">${r[1]}</text>`).join("")}</svg>`};
 $("ch1").innerHTML=bar(Object.keys(COUNTRIES).map(k=>[COUNTRIES[k].name,E.filter(e=>e.country==k).length,COUNTRIES[k].c1]),"#0b2a5b");
 const days=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);return d});
 $("ch2").innerHTML=bar(days.map(d=>[d.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"}),A.filter(a=>new Date(a.t).toDateString()==d.toDateString()).length]),"#b31942");
 $("ch3").innerHTML=bar([["Started",A.filter(a=>a.type=="form_started").length,"#8eaad6"],["Submitted",A.filter(a=>a.type=="form_submitted").length,"#13703a"]]);}
document.querySelector(".tabs").onclick=e=>{const t=e.target.dataset.t;if(!t)return;document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.t==t));["ent","act","ch"].forEach(x=>$("t-"+x).style.display=x==t?"block":"none")};
["fc","fs","ft"].forEach(i=>$(i).onchange=render);$("fq").oninput=render;
$("etab").onclick=e=>{const id=e.target.dataset.v;if(!id)return;cur=LS.get("nis_entries",[]).find(x=>x.id==id);
 const d=cur.data||{};$("dbody").innerHTML=`<h3 style="margin-top:0">${cur.id} ${st(cur.status)}</h3><table>${Object.entries(d).filter(([k,v])=>v!==""&&v!==false).map(([k,v])=>`<tr><th>${k}</th><td>${v===true?"✔":esc(v)}</td></tr>`).join("")}</table>`;$("dm").style.display="flex"};
function setSt(s){const E=LS.get("nis_entries",[]);const x=E.find(y=>y.id==cur.id);x.status=s;LS.set("nis_entries",E);logAct("status",`${x.id} marked ${s} – ${x.school}`,x.country);$("dm").style.display="none";render()}
$("dap").onclick=()=>setSt("Approved");$("dde").onclick=()=>setSt("Declined");$("dcl").onclick=()=>$("dm").style.display="none";
function dl(name,rows){const csv=rows.map(r=>r.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(",")).join("\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download=name;a.click()}
$("csv").onclick=()=>dl("nismcaa_entries.csv",[["Ref","Date","Country","School","Entrant","Category","Fee","Paid","Status","Email"],...LS.get("nis_entries",[]).map(e=>[e.id,e.t,COUNTRIES[e.country].name,e.school,e.entrant,e.cat,e.fee,e.paid,e.status,e.email])]);
$("acsv").onclick=()=>dl("nismcaa_activity.csv",[["When","Type","Country","Detail"],...LS.get("nis_act",[]).map(a=>[a.t,a.type,a.country,a.detail])]);
$("reset").onclick=()=>{if(confirm("Delete all test entries and activity on this device?")){localStorage.removeItem("nis_entries");localStorage.removeItem("nis_act");render()}};
$("demo").onclick=()=>{const E=LS.get("nis_entries",[]),now=Date.now();
 const mk=(c,cat,sch,ent,rep,stt,h)=>{const id="NIS-"+c.toUpperCase()+"-"+String(now-h*3600e3).slice(-6);const f=feeFor(c,CATS.find(x=>x[1]==cat)[0]);return{id,country:c,cat,school:sch,entrant:ent,city:"",region:"",rep,email:"",fee:f,paid:f>0?true:null,status:stt,t:new Date(now-h*3600e3).toISOString(),data:{school:sch,entrant:ent,cat,rep}}};
 const D=[mk("us","Individual student music","Lincoln Middle School","Emily Johnson","Sarah Williams","Submitted",3),mk("us","Academic award: Best Student","Roosevelt High School","James Miller","Karen Wilson","Approved",30),mk("ng","School group music","Kings College Lagos","Kings College Choir","Ngozi Eze","Submitted",8),mk("ng","Academic award: Best Teacher / Lecturer","Queens College Yaba","Mrs. Funmi Bakare","Ada Nwosu","Submitted",52),mk("ca","Individual student music","Maple Grove Middle School","Olivia Martin","David Clark","Submitted",75),mk("uk","School group music","Riverside Academy","Riverside Band","Thomas Wright","Declined",100)];
 LS.set("nis_entries",[...D,...E].sort((a,b)=>b.t.localeCompare(a.t)));D.forEach((d,i)=>{const A=LS.get("nis_act",[]);A.push({t:d.t,type:"form_started",detail:d.school+" started",country:d.country},{t:d.t,type:"form_submitted",detail:d.id+" submitted – "+d.school,country:d.country});LS.set("nis_act",A.sort((a,b)=>b.t.localeCompare(a.t)))});render()};
render();
</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>SOTD admin</title>
<style>body{font-family:system-ui,sans-serif;max-width:640px;margin:0 auto;padding:16px;color:#24123a}h1{color:#5B2A86}input,button{width:100%;min-height:48px;font-size:16px;margin:6px 0;box-sizing:border-box}button{background:#D4A537;border:0;border-radius:10px;font-weight:800}td{padding:8px;border-bottom:1px solid #eee}table{width:100%;border-collapse:collapse}</style></head><body>
<h1>School of the Decade: vote counts</h1><input id="tok" type="password" placeholder="Admin token" autocomplete="off"><button id="ab">Show counts</button><div id="ao"></div>
<script>const N={dansol:'Dansol High School',inglewood:'Inglewood Academy, Ikorodu',ronik:'Ronik Comprehensive',honeyland:'Honeyland College',imperial:'Imperial Light College',platform:'Platform School',lagoon:'Lagoon School'};
ab.onclick=async()=>{try{const r=await fetch('https://nismcaa-payments.onrender.com/poll/sotd/admin',{headers:{Authorization:'Bearer '+tok.value}});if(!r.ok){ao.textContent='Wrong token.';return}const d=await r.json();
ao.innerHTML=`<p>Total: <b>${d.total}</b> · connections (hashed IPs): ${d.uniqueIps} · deadline ${d.deadline}</p><table>`+d.results.slice().sort((a,b)=>b.votes-a.votes).map(x=>`<tr><td>${N[x.id]}</td><td>${x.votes}</td><td>${x.pct}%</td></tr>`).join('')+'</table>'}catch{ao.textContent='Server unavailable, try again.'}}</script></body></html>
